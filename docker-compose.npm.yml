version: '3.8'

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      # Public HTTP & HTTPS
      - '80:80'
      - '443:443'
      # Admin Web UI (Port 81)
      - '81:81'
    volumes:
      - ./npm-data:/data
      - ./npm-letsencrypt:/etc/letsencrypt
    networks:
      - npm-internal

networks:
  npm-internal:
    name: npm-internal
    # If network already created beforehand via 'docker network create npm-internal', set external: true

