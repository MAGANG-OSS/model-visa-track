version: '3.8'

services:
  visa-track-app:
    container_name: visa-track-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # Expose port 8501 internally to other containers in npm-internal network
    expose:
      - "8501"
    # Optional: uncomment ports mapping below if you also want to access directly without NPM (e.g. localhost:8501)
    # ports:
    #   - "8501:8501"
    networks:
      - npm-internal
    environment:
      - PYTHONUNBUFFERED=1

networks:
  npm-internal:
    external: true

